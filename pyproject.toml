[project]
name = "hypersonic-body-cfd"
version = "0.1.0"
description = "Hypersonic blunt body aerothermodynamics: analytical foundation, geometry, and SU2 RANS CFD"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "gmsh>=4.14",
    "ezdxf>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geometry", "src/validation", "src/physics", "src/pipeline", "src/viz", "src/cfd", "src/thermal"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (require actual SU2 runs)",
]
